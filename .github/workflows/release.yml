name: Release

# release-please keeps a release PR open (version bump + CHANGELOG.md from the Conventional
# Commits on main). Merging it tags the release, and the nds job then builds verity.nds and
# attaches it. The build lives here rather than in an on-tag workflow because tags pushed with
# GITHUB_TOKEN don't trigger other workflows. Run it by hand to build the .nds as a run artifact
# without releasing.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BLOCKSDS: /opt/wonderful/thirdparty/blocksds/core

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  nds:
    name: Build verity.nds
    needs: release-please
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload to the release
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      # BlocksDS through the Wonderful toolchain, as installed locally (/opt/wonderful).
      - name: Install BlocksDS
        run: |
          sudo mkdir -p /opt/wonderful
          sudo chown "$USER" /opt/wonderful
          curl -sSfL https://wonderful.asie.pl/bootstrap/wf-bootstrap-x86_64.tar.gz | tar -xz -C /opt/wonderful
          export PATH=/opt/wonderful/bin:$PATH
          wf-pacman -Syu --noconfirm
          wf-pacman -S --noconfirm wf-tools
          wf-config repo enable blocksds
          wf-pacman -Syu --noconfirm
          wf-pacman -S --noconfirm blocksds-toolchain
      # The data blobs (gitignored) come from PKHeX.Core's NuGet package through the oracle.
      - name: Build the data blobs
        run: scripts/build-data.sh
      - name: Build the .nds
        run: make nds
      - uses: actions/upload-artifact@v7
        with:
          name: verity-nds
          path: nds/verity.nds
          if-no-files-found: error
      - name: Attach to the release
        if: needs.release-please.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" nds/verity.nds
