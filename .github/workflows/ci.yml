name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read # paths-filter lists a pull request's files through the API

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ds: ${{ steps.filter.outputs.ds }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint reads every commit in the push
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install commitlint (root tooling only)
        run: npm ci --workspaces=false
      - name: Conventional commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before": check just its last commit.
          if [ "$FROM" = 0000000000000000000000000000000000000000 ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$FROM" --to "$TO" --verbose
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'Cargo.toml'
              - 'package.json'
              - 'package-lock.json'
              - '.node-version'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            rust:
              - *shared
              - 'crates/**'
              - 'data/**'
            ds:
              - *shared
              - 'crates/verity/**'
              - 'crates/verity-ffi/**'
              - 'crates/verity-rom/**'
            web:
              - *shared
              - 'web/**'
              - 'crates/verity/**'
              - 'crates/verity-wasm/**'
              # The deployed site's data blobs.
              - 'crates/datagen/**'
              - 'tools/pkhex-oracle/**'
              - 'scripts/build-data.sh'

  test:
    name: Rust test, lint, DS build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # The DS build is mostly our own crates (and core/alloc) for the ARM target.
          cache-workspace-crates: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: needs.changes.outputs.ds == 'true'
        run: cargo build-ds
      - if: needs.changes.outputs.ds == 'true'
        name: DS library size
        run: ls -l target/armv5te-none-eabi/release/libverity_ffi.a

  web:
    name: Web (types, lint, components)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run core
        env:
          VERITY_WASM_DEV: 1
      - run: npm run check
      - run: npm run lint
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      # The runner image already has Chromium's system libraries.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      # Component interaction tests (Storybook play functions) in headless Chromium. The
      # end-to-end Playwright journeys need real saves, which CI doesn't have.
      - run: npx vitest --run

  deploy:
    name: Deploy web (Cloudflare Workers)
    needs: [changes, web]
    # Pushes to main whose web checks passed. Without the Cloudflare secrets the site is still
    # built (so the build stays tested) and the upload is skipped.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.web.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The data blobs (gitignored) come from PKHeX.Core's NuGet package through the oracle.
      - name: Build the data blobs
        run: scripts/build-data.sh
      - name: Build the site (release WASM, blobs in static/data)
        run: npm run build
        working-directory: web
      # Static files on Workers (web/wrangler.jsonc); the Worker is created on first deploy.
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
      - name: No Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Site built; deploy skipped (set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID)."
