name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read # paths-filter lists a pull request's files through the API

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts of the repo changed; each job below runs only for its part. A docs-only push
  # runs none of them. Anything shared (the core crate, Cargo files, the toolchain, this
  # workflow) runs everything that depends on it.
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ds: ${{ steps.filter.outputs.ds }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            rust:
              - *shared
              - 'crates/**'
              - 'data/**'
            ds:
              - *shared
              - 'crates/verity/**'
              - 'crates/verity-ffi/**'
              - 'crates/verity-rom/**'
            web:
              - *shared
              - 'web/**'
              - 'crates/verity/**'
              - 'crates/verity-wasm/**'

  test:
    name: Native test & lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  arm9:
    name: DS core build (armv5te)
    needs: changes
    if: needs.changes.outputs.ds == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build-ds
      - name: Size
        run: ls -l target/armv5te-none-eabi/release/libverity_ffi.a

  web:
    name: Web (types, lint, components)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run core
      - run: npm run check
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      # Component interaction tests (Storybook play functions) in headless Chromium. The
      # end-to-end Playwright journeys need real saves, which CI doesn't have.
      - run: npx vitest --run
