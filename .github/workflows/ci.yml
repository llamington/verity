name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read # paths-filter lists a pull request's files through the API

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ds: ${{ steps.filter.outputs.ds }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            rust:
              - *shared
              - 'crates/**'
              - 'data/**'
            ds:
              - *shared
              - 'crates/verity/**'
              - 'crates/verity-ffi/**'
              - 'crates/verity-rom/**'
            web:
              - *shared
              - 'web/**'
              - 'crates/verity/**'
              - 'crates/verity-wasm/**'

  test:
    name: Rust test, lint, DS build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: needs.changes.outputs.ds == 'true'
        run: cargo build-ds
      - if: needs.changes.outputs.ds == 'true'
        name: DS library size
        run: ls -l target/armv5te-none-eabi/release/libverity_ffi.a

  web:
              - *shared
              - 'web/**'
              - 'crates/verity/**'
              - 'crates/verity-wasm/**'

  test:
    name: Native test & lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  arm9:
    name: DS core build (armv5te)
    needs: changes
    if: needs.changes.outputs.ds == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build-ds
      - name: Size
        run: ls -l target/armv5te-none-eabi/release/libverity_ffi.a

  web:
    name: Web (types, lint, components)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run core
        env:
          VERITY_WASM_DEV: 1
      - run: npm run check
      - run: npm run lint
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      # The runner image already has Chromium's system libraries.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      # Component interaction tests (Storybook play functions) in headless Chromium. The
      # end-to-end Playwright journeys need real saves, which CI doesn't have.
      - run: npx vitest --run
