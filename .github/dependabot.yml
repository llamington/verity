# Weekly dependency update PRs. Minor and patch bumps are grouped into one PR per ecosystem;
# major bumps get their own PR each, except within the npm families below. Commit messages follow commitlint: "build(deps): ...".
# Not covered: tools/pkhex-oracle's PKHeX.Core (NuGet), which is pinned to match ~/src/PKHeX,
# rust-toolchain.toml, and TypeScript majors (ignored below).
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /fuzz # outside the workspace, with its own Cargo.lock
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      fuzz:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: / # the root lockfile covers the web/ workspace
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    ignore:
      # typescript-eslint 8 crashes on TypeScript 7 (the native port). Lift this once
      # typescript-eslint supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    # Packages that release in lockstep share a PR for every update type, majors included, since a
    # lone bump fails CI. A dependency joins the first group it matches, so these come before "npm".
    groups:
      storybook:
        patterns: [storybook, "@storybook/*"]
      vitest:
        patterns: [vitest, "@vitest/*"]
      svelte-vite:
        patterns: [vite, svelte, "@sveltejs/*"]
      eslint:
        patterns: [eslint, "@eslint/*", typescript-eslint]
      playwright:
        patterns: [playwright, "@playwright/*"]
      tailwind:
        patterns: [tailwindcss, "@tailwindcss/*"]
      commitlint:
        patterns: ["@commitlint/*"]
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        update-types: [minor, patch]
