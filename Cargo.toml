[workspace]
members = [
    "crates/verity",
    "crates/verity-ffi",
    "crates/verity-rom",
    "crates/datagen",
    "crates/verity-wasm",
    "crates/verity-ds",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Bailey Lissington <lissington4@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/llamington/verity"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"

# Every crate forbids unsafe code except verity-ffi (the C ABI) and verity-ds (the DS front end,
# over libnds), which set their own lints: each unsafe operation in its own block, with a SAFETY
# comment.
[workspace.lints.rust]
unsafe_code = "forbid"
